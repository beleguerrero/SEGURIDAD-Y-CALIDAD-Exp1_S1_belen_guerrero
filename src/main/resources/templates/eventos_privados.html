<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos Privados</title>
    
    
    <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=Space+Grotesk:wght@600;700&amp;display=swap"
    rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config" src="tailwind.config.js"></script>
</head>
<body class="bg-surface font-body-md text-body-md text-on-surface antialiased">
  
    <header class="fixed top-0 left-0 right-0 z-50 bg-surface-container-lowest/90 backdrop-blur-xl border-b border-outline-variant/30 shadow-sm">
        <div class="h-16 w-full max-w-[1440px] mx-auto px-margin flex items-center justify-between gap-space-md">
            <div class="flex items-center gap-space-xl">
                <a class="flex items-center gap-space-sm group" data-path="inicio-explorar" href="/">
                    <span class="font-headline-sm text-headline-sm text-on-surface tracking-tight font-bold">LevelStart</span>
                </a>
                <nav class="hidden md:flex items-center gap-space-xs p-space-xs">
                    <a class="px-space-md py-space-sm font-label-md text-label-md text-on-surface-variant hover:text-on-surface hover:bg-surface-container rounded-lg transition-all" data-path="eventos-privados-comunidad"
                        href="/eventos-privados">
                        Eventos Privados (Comunidad)
                    </a>
                </nav>
            </div>
            <div class="flex items-center gap-space-md">
                <a class="hidden sm:inline-flex items-center justify-center px-space-md py-space-sm rounded-lg bg-surface-container-lowest text-on-surface font-label-md text-label-md hover:bg-surface-container hover:text-primary transition-all border border-outline-variant" data-path="iniciar-sesion-registro"
                    href="/registro">
                    Iniciar Sesión / Registro
                </a>
                <a class="flex items-center gap-space-sm pl-space-sm pr-space-xs py-space-xs rounded-xl bg-surface-container border border-outline-variant/40 hover:bg-surface-container-high transition-all group" data-path="mi-perfil-gamer" href="#">
                    <div class="hidden xl:flex flex-col text-right">
                        <span class="font-label-md text-label-md text-on-surface group-hover:text-primary transition-colors leading-tight">Mi Perfil</span>
                    </div>
                    <div class="relative flex items-center justify-center">
                        <div class="w-9 h-9 rounded-full bg-surface-container-lowest ring-2 ring-primary/30 group-hover:ring-primary flex items-center justify-center overflow-hidden border border-outline-variant/30">
                            <span class="material-symbols-outlined text-primary text-[20px]">sports_esports</span>
                        </div>
                    </div>
                </a>
            </div>
        </div>
    </header>

    

    <main class="w-full pt-16 bg-surface min-h-[calc(100vh-16rem)]">
        Eventos Privados
    </main>


    <footer class="w-full bg-surface-container-lowest mt-space-xl border-t border-outline-variant/30">
        <div class="w-full max-w-[1440px] mx-auto px-margin py-space-xl flex flex-col md:flex-row items-center justify-between gap-space-lg">
            <div class="flex flex-col sm:flex-row items-center gap-space-md text-center sm:text-left">
                <div class="flex items-center gap-space-xs">
                    <span class="font-headline-sm text-headline-sm text-on-surface font-bold tracking-tight">LevelStart</span>
                </div>
                <span class="hidden sm:inline text-outline">•</span>
                <p class="font-body-sm text-body-sm text-on-surface-variant">
                    © 2026 LevelStart. Portal competitivo y social de esports.
                </p>
            </div>
            <div class="flex items-center gap-space-lg">
                <a
                    class="font-label-md text-label-md uppercase tracking-wider text-on-surface-variant hover:text-primary hover:bg-surface-container px-space-sm py-space-xs rounded transition-all"
                    data-path="eventos-privados-comunidad"
                    href="#"
                    >Discord</a
                ><a
                    class="font-label-md text-label-md uppercase tracking-wider text-on-surface-variant hover:text-primary hover:bg-surface-container px-space-sm py-space-xs rounded transition-all"
                    data-path="marcas-patrocinadores"
                    href="#"
                    >Patrocinadores</a
                ><a
                    class="font-label-md text-label-md uppercase tracking-wider text-on-surface-variant hover:text-primary hover:bg-surface-container px-space-sm py-space-xs rounded transition-all"
                    data-path="inicio-explorar"
                    href="#"
                    >Explorar</a
                ><a
                    class="font-label-md text-label-md uppercase tracking-wider text-on-surface-variant hover:text-on-surface hover:bg-surface-container px-space-sm py-space-xs rounded transition-all"
                    data-path="iniciar-sesion-registro"
                    href="#"
                    >Acceso</a
                >
            </div>
        </div>
    </footer>


</body>
</html>
